name: lavanderia_partner
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  cached_network_image: ^3.3.1
  carousel_slider: ^5.1.1
  connectivity_plus: ^7.1.1
  dio: ^5.7.0
  easy_localization: ^3.0.7
  equatable: ^2.0.5
  expandable_page_view: ^1.0.17
  file_picker: ^10.3.3
  firebase_auth: ^5.3.3
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_local_notifications: ^18.0.1
  flutter_svg: ^2.0.14
  flutter_screenutil: ^5.9.3
  font_awesome_flutter: ^10.8.0
  gap: ^3.0.1
  geocoding: ^5.0.0
  geolocator: ^13.0.2
  get_it: ^8.0.2
  go_router: ^15.1.2
  google_sign_in: ^6.2.2
  http: ^1.2.2
  image: ^4.1.3
  image_picker: ^1.1.2
  internet_connection_checker_plus: ^2.0.0
  intl_phone_field: ^3.2.0
  loading_animation_widget: ^1.3.0
  logger: ^2.5.0
  lottie: ^3.3.1
  path_provider: ^2.1.5
  pdf: ^3.10.4
  permission_handler: ^11.0.1
  pin_code_text_field: ^1.8.0
  pinput: ^5.0.1
  pretty_dio_logger: ^1.4.0
  printing: ^5.11.0
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  sign_in_with_apple: ^7.0.1
  slide_to_act: ^2.0.2
  timezone: ^0.10.0
  url_launcher: ^6.3.1
  open_file: ^3.2.1
  flutter_image_compress: ^2.4.0

  cupertino_icons: ^1.0.8
  video_player: ^2.14.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# أيقونة التطبيق، بتتولد من assets/icon
# بعد أي تعديل هنا شغل: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # الأندرويد الجديد بيستخدم adaptive icon: الرمز شفاف على خلفية البراند
  adaptive_icon_background: "#3872E0"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:

  uses-material-design: true

  fonts:
  - family: SF Arabic
    fonts:
      - asset: assets/fonts/SFArabic-Regular.ttf
        weight: 400
      # الملف مسمّى SemiBold لكن ميتاداتا الخط Bold / usWeightClass 711
      - asset: assets/fonts/SF-Arabic-SemiBold.ttf
        weight: 700
      - asset: assets/fonts/sf-arabic-black.ttf
        weight: 900
  - family: SF Arabic Rounded
    fonts:
      - asset: assets/fonts/SFArabicRounded-Regular.ttf
        weight: 400

        

  assets:
    - assets/
    - assets/icon/
    - assets/icons/
    - assets/fonts/
    - assets/images/
    - assets/translations/

flutter_assets:
  assets_path: assets/
  output_path: lib/core/style/
  filename: assets.dart